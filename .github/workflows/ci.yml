name: Korp DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Start Stack (Docker Compose)
        run: docker compose up -d --build

      - name: Wait for Services to Stabilize
        run: sleep 10

      - name: Run Smoke Test & Load Generator
        run: python3 scripts/load-generator.py

      - name: Inspect Container Status and Logs
        if: always()
        run: |
          docker compose ps
          docker compose logs http-server-projeto-korp