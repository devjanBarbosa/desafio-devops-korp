networks:
  korp-network:
    driver: bridge

services:
  http-server-projeto-korp:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: http-server-projeto-korp
    networks:
      - korp-network
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-proxy
    networks:
      - korp-network
    ports:
      - "80:80"
    volumes:
      - ./nginx/http-server-projeto-korp.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - http-server-projeto-korp
    restart: unless-stopped